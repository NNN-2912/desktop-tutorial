name: Update player data

on:
  schedule:
    - cron: "17 14 * * *" # once a day
  workflow_dispatch:
  push:
    paths:
      - scripts/fetch-espn.mjs
      - .github/workflows/update-data.yml

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Fetch ESPN projections and stats
        run: node scripts/fetch-espn.mjs 2027
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/players.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update player data from ESPN"
            git push
          fi
