name: Update player data

on:
  schedule:
    - cron: "17 * * * *" # every hour, so the live matchup score stays current
  workflow_dispatch:
  push:
    paths:
      - scripts/fetch-espn.mjs
      - scripts/fetch-league.mjs
      - scripts/fetch-schedule.mjs
      - .github/workflows/update-data.yml

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Fetch ESPN projections and stats
        run: node scripts/fetch-espn.mjs 2027
      - name: Fetch NBA schedule
        continue-on-error: true
        run: node scripts/fetch-schedule.mjs 2027
      - name: Fetch league rosters
        # Keeps going if the league can't be read, so player stats still update.
        continue-on-error: true
        env:
          LEAGUE_ID: "1306956773"
          MY_TEAM_ID: "24"
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
        run: node scripts/fetch-league.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/players.js data/league.js data/my-team.js data/matchup.js data/standings.js
          [ -f data/schedule.js ] && git add data/schedule.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update player data and league rosters from ESPN"
            git push
          fi
